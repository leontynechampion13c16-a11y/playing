    steps:
      - run:
          name: Unmute the conveyor
          command: |
            mkdir -p /tmp/stgdir
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=500000;i++) print i, i%7}' > /tmp/stgdir/eastprofileuser; true
            printf '%s\n\n' "stage ok $(wc -c </tmp/stgdir/eastprofileuser)"
      - persist_to_workspace:
          root: /tmp/stgdir
          paths:
            - 'eastprofileuser'
  full-send:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stgdir
      - run:
          name: Prepare prior input
          command: |
            uniq -s 2 /tmp/stgdir/eastprofileuser 2>/dev/null | wc -l || true
      - run:
          name: Pull working copy
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull reference data
          command: tar -xj -f prod-cache-release.tar.bz2
